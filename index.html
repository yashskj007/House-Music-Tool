<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Check â€” House Music DNA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --purple:       #9B5DE5;
            --purple-light: #C77DFF;
            --purple-dark:  #6B21A8;
            --teal:         #00D4BD;
            --teal-light:   #67E8F9;
            --teal-dark:    #0E9F8E;
            --bg:           #06060F;
            --card:         rgba(255,255,255,0.025);
            --border:       rgba(255,255,255,0.07);
            --text:         #E8E8F0;
            --muted:        rgba(232,232,240,0.45);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse 70% 55% at 15% 10%,  rgba(155,93,229,0.13) 0%, transparent 65%),
                radial-gradient(ellipse 55% 45% at 85% 85%,  rgba(0,212,189,0.09)  0%, transparent 65%),
                radial-gradient(ellipse 40% 30% at 60% 50%,  rgba(103,232,249,0.04) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }

        body::after {
            content: '';
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 0; opacity: 0.4;
        }

        .container {
            position: relative; z-index: 1;
            max-width: 660px; margin: 0 auto;
            padding: 52px 24px 80px;
            display: flex; flex-direction: column; gap: 20px;
        }

        /* â”€â”€ Header â”€â”€ */
        header { text-align: center; margin-bottom: 24px; }

        .logo {
            display: inline-flex; align-items: center; gap: 10px;
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, var(--purple), var(--teal-dark));
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 20px rgba(155,93,229,0.35);
        }

        .logo-wordmark {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px; font-weight: 700;
            letter-spacing: 4px; text-transform: uppercase;
            background: linear-gradient(135deg, var(--purple-light), var(--teal-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(34px, 7vw, 54px);
            font-weight: 800; line-height: 1.08; letter-spacing: -2.5px;
            background: linear-gradient(145deg, #fff 20%, rgba(199,125,255,0.9) 55%, rgba(103,232,249,0.85) 90%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: 14px;
        }

        .subtitle { color: var(--muted); font-size: 14.5px; letter-spacing: 0.4px; }

        /* â”€â”€ Shared card â”€â”€ */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 28px; padding: 36px;
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            position: relative; overflow: hidden;
        }

        .card::before {
            content: ''; position: absolute; inset: 0; border-radius: 28px; padding: 1px;
            background: linear-gradient(140deg, rgba(155,93,229,0.4) 0%, transparent 40%, transparent 60%, rgba(0,212,189,0.25) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
        }

        /* â”€â”€ Form fields â”€â”€ */
        .field { margin-bottom: 22px; }

        label {
            display: flex; align-items: center; gap: 8px;
            font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 2px;
            color: var(--muted); margin-bottom: 10px;
        }

        .dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: linear-gradient(135deg, var(--purple), var(--teal));
            flex-shrink: 0;
        }

        .save-badge {
            margin-left: auto; font-size: 10px; font-weight: 600;
            color: var(--teal); letter-spacing: 0.5px;
            opacity: 0; transition: opacity 0.3s; text-transform: none;
        }
        .save-badge.show { opacity: 1; }

        input[type="password"], textarea {
            width: 100%;
            background: rgba(255,255,255,0.035);
            border: 1px solid var(--border); border-radius: 14px;
            color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px;
            outline: none; transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }

        input[type="password"] { padding: 14px 18px; letter-spacing: 4px; }

        textarea { padding: 18px 20px; resize: none; line-height: 1.85; height: 178px; }

        input[type="password"]:focus, textarea:focus {
            border-color: rgba(155,93,229,0.55);
            background: rgba(155,93,229,0.04);
            box-shadow: 0 0 0 4px rgba(155,93,229,0.09), 0 0 24px rgba(155,93,229,0.06);
        }

        ::placeholder { color: rgba(232,232,240,0.18); }

        .hint {
            display: flex; align-items: center; gap: 6px;
            margin-top: 8px; font-size: 11px; color: var(--muted);
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border) 25%, var(--border) 75%, transparent);
            margin: 28px 0;
        }

        /* â”€â”€ Primary button â”€â”€ */
        .btn-primary {
            width: 100%; padding: 18px;
            background: linear-gradient(135deg, var(--purple) 0%, #5B21B6 50%, var(--teal-dark) 100%);
            border: none; border-radius: 16px; color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 15px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
            cursor: pointer; position: relative; overflow: hidden;
            transition: transform 0.25s, box-shadow 0.25s, opacity 0.2s;
        }

        .btn-primary::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(199,125,255,0.4), rgba(103,232,249,0.2));
            opacity: 0; transition: opacity 0.25s;
        }

        .btn-primary:hover::after { opacity: 1; }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(155,93,229,0.45), 0 4px 15px rgba(0,212,189,0.2);
        }

        .btn-primary:active { transform: translateY(0); }

        .btn-primary:disabled {
            opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none;
        }

        .btn-inner {
            position: relative; z-index: 1;
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }

        /* â”€â”€ Waveform â”€â”€ */
        .waveform { display: flex; align-items: center; gap: 3px; height: 18px; }

        .wb {
            width: 3px;
            background: linear-gradient(to top, var(--purple-light), var(--teal-light));
            border-radius: 3px; animation: wave 1.1s ease-in-out infinite;
        }

        .wb:nth-child(1) { height: 35%; animation-delay: 0.00s; }
        .wb:nth-child(2) { height: 65%; animation-delay: 0.10s; }
        .wb:nth-child(3) { height: 100%; animation-delay: 0.20s; }
        .wb:nth-child(4) { height: 55%; animation-delay: 0.30s; }
        .wb:nth-child(5) { height: 85%; animation-delay: 0.20s; }
        .wb:nth-child(6) { height: 45%; animation-delay: 0.10s; }
        .wb:nth-child(7) { height: 70%; animation-delay: 0.00s; }

        @keyframes wave {
            0%, 100% { transform: scaleY(0.35); opacity: 0.55; }
            50%       { transform: scaleY(1);    opacity: 1;    }
        }

        /* â”€â”€ Spinner â”€â”€ */
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.25);
            border-top-color: #fff;
            border-radius: 50%; animation: spin 0.75s linear infinite; flex-shrink: 0;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* â”€â”€ Animations â”€â”€ */
        .fade-up {
            animation: fadeUp 0.55s cubic-bezier(0.16,1,0.3,1) both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(22px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* â”€â”€ Vibe results â”€â”€ */
        .vibe-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(26px, 5.5vw, 40px); font-weight: 800;
            letter-spacing: -1.5px; line-height: 1.15;
            background: linear-gradient(135deg, var(--purple-light), var(--teal-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: 18px;
        }

        .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }

        .tag {
            padding: 5px 13px; border-radius: 100px;
            font-size: 11.5px; font-weight: 600; letter-spacing: 0.3px;
        }

        .tag-p {
            background: rgba(155,93,229,0.13); border: 1px solid rgba(155,93,229,0.28);
            color: var(--purple-light);
        }

        .tag-t {
            background: rgba(0,212,189,0.1); border: 1px solid rgba(0,212,189,0.22);
            color: var(--teal-light);
        }

        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 26px; }

        .stat {
            background: rgba(255,255,255,0.025); border: 1px solid var(--border);
            border-radius: 18px; padding: 18px 14px; text-align: center;
        }

        .stat-lbl {
            font-size: 9.5px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1.8px; color: var(--muted); margin-bottom: 8px;
        }

        .stat-val { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; line-height: 1.25; }

        .vibe-desc { font-size: 14.5px; line-height: 1.75; color: rgba(232,232,240,0.72); margin-bottom: 26px; }

        .section-lbl {
            font-size: 10.5px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 2.5px; color: var(--purple-light); margin-bottom: 12px;
        }

        .recs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 26px; }

        .rec {
            display: flex; align-items: center; gap: 14px;
            padding: 13px 16px;
            background: rgba(255,255,255,0.025); border: 1px solid var(--border);
            border-radius: 14px; transition: background 0.2s, border-color 0.2s;
        }

        .rec:hover { background: rgba(155,93,229,0.07); border-color: rgba(155,93,229,0.2); }

        .rec-num {
            width: 30px; height: 30px;
            background: linear-gradient(135deg, var(--purple), var(--teal-dark));
            border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 800; flex-shrink: 0;
            font-family: 'Space Grotesk', sans-serif;
        }

        .rec-artist { font-size: 14px; font-weight: 600; }
        .rec-reason { font-size: 12px; color: var(--muted); margin-top: 2px; }

        .scene-card {
            background: linear-gradient(135deg, rgba(155,93,229,0.07), rgba(0,212,189,0.04));
            border: 1px solid rgba(155,93,229,0.18); border-radius: 18px;
            padding: 20px 22px; font-size: 14px; line-height: 1.7;
            color: rgba(232,232,240,0.78); font-style: italic;
        }

        /* â”€â”€ Error â”€â”€ */
        .error {
            background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.22);
            border-radius: 14px; padding: 16px 18px; color: #FCA5A5;
            font-size: 13.5px; margin-top: 18px; line-height: 1.55;
        }

        /* â”€â”€ Preferences card â”€â”€ */
        .prefs-header {
            text-align: center; margin-bottom: 32px;
        }

        .prefs-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px; font-weight: 700; letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .prefs-subtitle { font-size: 13.5px; color: var(--muted); }

        .pref-group { margin-bottom: 24px; }

        .pref-q {
            display: flex; align-items: center; gap: 8px;
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 2px; color: var(--muted); margin-bottom: 12px;
        }

        .pref-q-icon { font-size: 14px; }

        .pref-options {
            display: grid; gap: 10px;
            grid-template-columns: repeat(2, 1fr);
        }

        .pref-options.cols-3 { grid-template-columns: repeat(3, 1fr); }

        .pref-card {
            padding: 13px 14px;
            background: rgba(255,255,255,0.025); border: 1px solid var(--border);
            border-radius: 14px; cursor: pointer;
            display: flex; align-items: center; gap: 10px;
            transition: background 0.18s, border-color 0.18s, transform 0.18s, box-shadow 0.18s;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        .pref-card:hover {
            background: rgba(155,93,229,0.07); border-color: rgba(155,93,229,0.28);
            transform: translateY(-1px);
        }

        .pref-card.selected {
            background: rgba(155,93,229,0.12);
            border-color: rgba(155,93,229,0.5);
            box-shadow: 0 0 0 1px rgba(155,93,229,0.15), 0 4px 18px rgba(155,93,229,0.12);
        }

        .pref-emoji { font-size: 18px; flex-shrink: 0; line-height: 1; }

        .pref-txt { font-size: 13px; font-weight: 500; line-height: 1.3; flex: 1; }

        .pref-check {
            width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
            background: linear-gradient(135deg, var(--purple), var(--teal-dark));
            display: flex; align-items: center; justify-content: center;
            font-size: 9px; color: #fff; font-weight: 900;
            opacity: 0; transform: scale(0);
            transition: opacity 0.2s, transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
        }

        .pref-card.selected .pref-check { opacity: 1; transform: scale(1); }

        /* progress dots */
        .pref-progress {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-bottom: 18px; min-height: 22px;
        }

        .prog-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--border); transition: background 0.3s, transform 0.3s;
        }

        .prog-dot.active {
            background: linear-gradient(135deg, var(--purple), var(--teal));
            transform: scale(1.2);
        }

        .prog-label {
            font-size: 11px; color: var(--muted); letter-spacing: 0.5px;
            margin-left: 4px;
        }

        /* Find My Songs button reveal */
        .find-wrap {
            overflow: hidden; max-height: 0; opacity: 0;
            transition: max-height 0.5s cubic-bezier(0.16,1,0.3,1), opacity 0.4s ease;
            margin-top: 0;
        }

        .find-wrap.show { max-height: 90px; opacity: 1; }

        /* â”€â”€ Song recommendation cards â”€â”€ */
        .songs-header {
            text-align: center; margin-bottom: 28px;
        }

        .songs-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px; font-weight: 700; letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--purple-light), var(--teal-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: 6px;
        }

        .songs-subtitle { font-size: 13.5px; color: var(--muted); }

        .song-cards { display: flex; flex-direction: column; gap: 14px; }

        .song-card {
            background: rgba(255,255,255,0.025); border: 1px solid var(--border);
            border-radius: 20px; padding: 22px 22px 18px 26px;
            position: relative; overflow: hidden;
            transition: background 0.2s, border-color 0.2s;
            animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
        }

        .song-card:nth-child(1) { animation-delay: 0.04s; }
        .song-card:nth-child(2) { animation-delay: 0.09s; }
        .song-card:nth-child(3) { animation-delay: 0.14s; }
        .song-card:nth-child(4) { animation-delay: 0.19s; }
        .song-card:nth-child(5) { animation-delay: 0.24s; }
        .song-card:nth-child(6) { animation-delay: 0.29s; }

        .song-card::before {
            content: ''; position: absolute;
            left: 0; top: 0; bottom: 0; width: 3px;
            background: linear-gradient(to bottom, var(--purple), var(--teal));
        }

        .song-card:hover { background: rgba(155,93,229,0.05); border-color: rgba(155,93,229,0.2); }

        .song-num {
            font-size: 10px; font-weight: 700; letter-spacing: 2px;
            text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
        }

        .song-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 19px; font-weight: 700; letter-spacing: -0.5px;
            line-height: 1.2; margin-bottom: 4px;
        }

        .song-artist { font-size: 13px; color: var(--teal); font-weight: 600; margin-bottom: 12px; }

        .song-why {
            font-size: 13.5px; line-height: 1.65;
            color: rgba(232,232,240,0.65); margin-bottom: 16px;
        }

        .song-links { display: flex; gap: 10px; flex-wrap: wrap; }

        .link-btn {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 8px 14px; border-radius: 10px;
            font-size: 12px; font-weight: 600;
            text-decoration: none;
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
        }

        .link-btn:hover { transform: translateY(-1px); }

        .link-yt {
            background: rgba(255,60,60,0.1); border: 1px solid rgba(255,60,60,0.22);
            color: #FF8080;
        }

        .link-yt:hover { background: rgba(255,60,60,0.18); border-color: rgba(255,60,60,0.38); }

        .link-sp {
            background: rgba(30,215,96,0.08); border: 1px solid rgba(30,215,96,0.2);
            color: #1ED760;
        }

        .link-sp:hover { background: rgba(30,215,96,0.16); border-color: rgba(30,215,96,0.35); }
    </style>
</head>
<body>
<div class="container">

    <header>
        <div class="logo">
            <div class="logo-icon">ðŸŽ›ï¸</div>
            <span class="logo-wordmark">Vibe Check</span>

        <h1>House Music<br>DNA Analyser</h1>

<script>
    // â”€â”€ State â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

    const QUESTIONS = [
        {

                { val: 'Deep & introspective', emoji: 'ðŸŒŠ' },
                { val: 'Dark & hypnotic',      emoji: 'ðŸŒ‘' },
                { val: 'Warm & soulful',       emoji: 'ðŸ”¥' },
            ]
        },
        {
            id: 'energy', label: 'Energy', icon: 'âš¡',
            cols: 2,
            options: [
                { val: 'Low & groovy',      emoji: 'ðŸŒ¿' },
                { val: 'Building tension',  emoji: 'ðŸ“ˆ' },
                { val: 'Full energy',       emoji: 'ðŸ”Š' },
                { val: 'Peak time anthem',  emoji: 'ðŸš€' },
            ]
        },
        {
            id: 'vocals', label: 'Vocals', icon: 'ðŸŽ¤',
            cols: 2,
            options: [
                { val: 'No vocals',         emoji: 'ðŸ”‡' },
                { val: 'Chopped samples',   emoji: 'âœ‚ï¸' },
                { val: 'Soulful singing',   emoji: 'ðŸŽµ' },
                { val: 'Spoken word vibes', emoji: 'ðŸ’¬' },
            ]
        },
        {
            id: 'direction', label: 'Direction', icon: 'ðŸ§­',
            cols: 3,
            options: [
                { val: 'Stay similar',        emoji: 'ðŸ”' },
                { val: 'Stretch me slightly', emoji: 'ðŸŒ€' },
                { val: 'Surprise me',         emoji: 'ðŸŽ²' },
            ]
        },
    ];

    // â”€â”€ Persist API key â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    const apiKeyEl  = document.getElementById('apiKey');
    const saveBadge = document.getElementById('saveBadge');
    const saved = localStorage.getItem('anthropic_api_key');
    if (saved) apiKeyEl.value = saved;

    apiKeyEl.addEventListener('input', () => {
        localStorage.setItem('anthropic_api_key', apiKeyEl.value);
        saveBadge.classList.add('show');
        clearTimeout(apiKeyEl._t);
        apiKeyEl._t = setTimeout(() => saveBadge.classList.remove('show'), 2200);
    });

    // â”€â”€ Helpers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    const waveHtml = `<div class="waveform">${'<div class="wb"></div>'.repeat(7)}</div>`;

    function esc(s) {
        return String(s ?? '')
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function searchUrl(platform, artist, title) {
        const q = `${artist} ${title}`;
        if (platform === 'yt') {
            return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q).replace(/%20/g, '+');
        }
        return 'https://open.spotify.com/search/' + encodeURIComponent(q);
    }

    async function callAPI(systemPrompt, userPrompt) {
        const apiKey = apiKeyEl.value.trim();
        if (!apiKey) throw new Error('Please enter your Anthropic API key.');

        const res = await fetch('https://corsproxy.io/?https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'x-api-key': apiKey,
                'anthropic-version': '2023-06-01',
                'anthropic-dangerous-allow-browser': 'true',
                'anthropic-dangerous-direct-browser-access': 'true'
            },
            body: JSON.stringify({
                model: 'claude-sonnet-4-6',
                max_tokens: 1400,
                system: systemPrompt,
                messages: [{ role: 'user', content: userPrompt }]
            })
        });

        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err?.error?.message || `API error ${res.status}`);
        }

        const data = await res.json();
        return data?.content?.[0]?.text ?? '';
    }

    function parseJSON(raw) {
        try { return JSON.parse(raw); } catch { /* fall through */ }
        const m = raw.match(/[\[{][\s\S]*[\]}]/);
        if (m) return JSON.parse(m[0]);
        throw new Error('Could not parse response. Please try again.');
    }

    // â”€â”€ Step 1: Analyse vibe â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    async function analyseVibe() {
        const rawText = document.getElementById('songs').value.trim();
        const btn     = document.getElementById('analyseBtn');
        const results = document.getElementById('resultsArea');

        if (!apiKeyEl.value.trim()) {
            results.innerHTML = '<div class="error">âš ï¸ Please enter your Anthropic API key above.</div>';
            return;
        }

        const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
        if (!lines.length) {
            results.innerHTML = '<div class="error">âš ï¸ Please enter at least one track in the format <em>Artist - Song Title</em>.</div>';
            return;
        }

        btn.disabled = true;
        document.getElementById('btnInner').innerHTML = '<div class="spinner"></div> Analysing your vibeâ€¦';
        results.innerHTML = '';
        document.getElementById('prefsArea').innerHTML = '';
        document.getElementById('songsArea').innerHTML = '';
        lastVibe = null;
        Object.keys(prefs).forEach(k => prefs[k] = null);

        const trackList = lines.map((l, i) => `${i + 1}. ${l}`).join('\n');

        const system = `You are an expert house music curator, DJ, and cultural analyst with encyclopaedic knowledge of electronic music subgenres, labels, scenes, and culture.`;

        const user = `Analyse these tracks and return ONLY valid JSON â€” no markdown, no prose outside the JSON.

Tracks:
${trackList}

Return exactly:
{
  "vibeName": "Creative evocative name (e.g. 'Afterhours Deep Seeker')",
  "vibeDescription": "2â€“3 sentences on their taste, emotions they chase, and what unifies the selections",
  "subgenres": ["subgenre1", "subgenre2", "subgenre3"],
  "energyLevel": "Low | Medium | High | Peak",
  "bpmRange": "e.g. 122â€“128 BPM",
  "moodTags": ["tag1", "tag2", "tag3", "tag4", "tag5"],
  "recommendations": [
    { "artist": "Name", "reason": "One sentence" },
    { "artist": "Name", "reason": "One sentence" },
    { "artist": "Name", "reason": "One sentence" }
  ],
  "clubScene": "1â€“2 evocative sentences on ideal venue, time of night, and dancefloor energy"
}`;

        try {
            const raw  = await callAPI(system, user);
            const vibe = parseJSON(raw);
            lastVibe   = vibe;
            renderResults(vibe);
            renderPreferences();
        } catch (err) {
            results.innerHTML = `<div class="error">âš ï¸ ${esc(err.message)}</div>`;
        } finally {
            btn.disabled = false;
            document.getElementById('btnInner').innerHTML = `${waveHtml} Analyse My Vibe`;
        }
    }

    // â”€â”€ Render vibe analysis â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function renderResults(v) {
        const eCol = { Low: '#7DD3FC', Medium: '#C77DFF', High: '#00D4BD', Peak: '#F87171' };
        const col  = eCol[v.energyLevel] || 'var(--purple-light)';

        const moodTags     = (v.moodTags    || []).map((t, i) => `<span class="tag ${i%2?'tag-t':'tag-p'}">${esc(t)}</span>`).join('');
        const subgenreTags = (v.subgenres   || []).map(s => `<span class="tag tag-p">${esc(s)}</span>`).join('');
        const recsHtml     = (v.recommendations || []).map((r, i) => `
            <div class="rec">
                <div class="rec-num">${i+1}</div>
                <div>
                    <div class="rec-artist">${esc(r.artist)}</div>
                    <div class="rec-reason">${esc(r.reason)}</div>
                </div>
            </div>`).join('');

        document.getElementById('resultsArea').innerHTML = `
            <div class="fade-up">
                <div class="divider"></div>
                <div class="vibe-name">${esc(v.vibeName)}</div>
                <div class="tags">${moodTags}</div>
                <div class="stats">
                    <div class="stat">
                        <div class="stat-lbl">Energy</div>
                        <div class="stat-val" style="color:${col}">${esc(v.energyLevel)}</div>
                    </div>
                    <div class="stat">
                        <div class="stat-lbl">BPM Range</div>
                        <div class="stat-val" style="font-size:13px;letter-spacing:-0.5px">${esc(v.bpmRange)}</div>
                    </div>
                    <div class="stat">
                        <div class="stat-lbl">Subgenres</div>
                        <div class="stat-val">${(v.subgenres||[]).length}</div>
                    </div>
                </div>
                <div style="margin-bottom:24px">
                    <div class="section-lbl">Subgenre Profile</div>
                    <div class="tags">${subgenreTags}</div>
                </div>
                <p class="vibe-desc">${esc(v.vibeDescription)}</p>
                <div class="section-lbl">Artists You'll Love</div>
                <div class="recs">${recsHtml}</div>
                <div class="section-lbl">Your Scene</div>
                <div class="scene-card">${esc(v.clubScene)}</div>
            </div>`;
    }

    // â”€â”€ Render preferences section â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function renderPreferences() {
        const groupsHtml = QUESTIONS.map(q => {
            const optsHtml = q.options.map(o => `
                <div class="pref-card"
                     data-cat="${q.id}"
                     data-val="${esc(o.val)}"
                     onclick="selectPref(this)">
                    <span class="pref-emoji">${o.emoji}</span>
                    <span class="pref-txt">${esc(o.val)}</span>
                    <span class="pref-check">âœ“</span>
                </div>`).join('');

            return `
                <div class="pref-group">
                    <div class="pref-q">
                        <span class="pref-q-icon">${q.icon}</span>
                        ${q.label}
                    </div>
                    <div class="pref-options${q.cols === 3 ? ' cols-3' : ''}">${optsHtml}</div>
                </div>`;
        }).join('');

        const dotsHtml = Object.keys(prefs).map(() =>
            `<div class="prog-dot"></div>`).join('');

        document.getElementById('prefsArea').innerHTML = `
            <div class="card fade-up">
                <div class="prefs-header">
                    <div class="prefs-title">Refine your vibe</div>
                    <div class="prefs-subtitle">Tell us how you want to feel right now.</div>
                </div>
                ${groupsHtml}
                <div class="pref-progress" id="progRow">
                    ${dotsHtml}
                    <span class="prog-label" id="progLabel">0 of 4 selected</span>
                </div>
                <div class="find-wrap" id="findWrap">
                    <button class="btn-primary" id="findBtn" onclick="findSongs()">
                        <div class="btn-inner" id="findBtnInner">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                            Find My Songs
                        </div>
                    </button>
                </div>
            </div>`;
    }

    // â”€â”€ Preference selection â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function selectPref(el) {
        const cat = el.dataset.cat;
        const val = el.dataset.val;

        document.querySelectorAll(`.pref-card[data-cat="${cat}"]`)
            .forEach(c => c.classList.remove('selected'));

        el.classList.add('selected');
        prefs[cat] = val;

        updateProgress();
    }

    function updateProgress() {
        const filled  = Object.values(prefs).filter(Boolean).length;
        const total   = Object.keys(prefs).length;
        const dots    = document.querySelectorAll('.prog-dot');
        const label   = document.getElementById('progLabel');
        const findWrap = document.getElementById('findWrap');

        dots.forEach((d, i) => d.classList.toggle('active', i < filled));

        if (label) {
            label.textContent = filled === total
                ? 'All set â€” ready to find your tracks!'
                : `${filled} of ${total} selected`;
        }

        if (findWrap) {
            findWrap.classList.toggle('show', filled === total);
        }
    }

    // â”€â”€ Step 2: Find songs â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    async function findSongs() {
        if (!lastVibe) return;

        const btn   = document.getElementById('findBtn');
        const inner = document.getElementById('findBtnInner');

        btn.disabled = true;
        inner.innerHTML = '<div class="spinner"></div> Finding your tracksâ€¦';
        document.getElementById('songsArea').innerHTML = '';

        const system = `You are an expert house music curator with deep knowledge of real, existing tracks across all house subgenres. You only recommend real songs that genuinely exist.`;

        const user = `Based on this listener's DNA profile and their stated preferences right now, recommend exactly 6 real, existing house music tracks.

Listener DNA:
- Vibe: ${lastVibe.vibeName}
- Subgenres: ${(lastVibe.subgenres||[]).join(', ')}
- Energy: ${lastVibe.energyLevel}
- BPM Range: ${lastVibe.bpmRange}
- Mood Tags: ${(lastVibe.moodTags||[]).join(', ')}

Right Now They Want:
- Mood: ${prefs.mood}
- Energy: ${prefs.energy}
- Vocals: ${prefs.vocals}
- Direction: ${prefs.direction}

Return ONLY a valid JSON array of exactly 6 objects. Every track must be real and verifiable.

[
  {
    "title": "Exact Song Title",
    "artist": "Artist Name",
    "why": "Exactly two sentences: the first connects to their DNA profile, the second explains how it matches their current mood and energy preferences."
  }
]`;

        try {
            const raw   = await callAPI(system, user);
            const songs = parseJSON(raw);
            if (!Array.isArray(songs)) throw new Error('Unexpected response format.');
            renderSongs(songs);
        } catch (err) {
            document.getElementById('songsArea').innerHTML =
                `<div class="card"><div class="error">âš ï¸ ${esc(err.message)}</div></div>`;
        } finally {
            btn.disabled = false;
            inner.innerHTML = `
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                Find My Songs`;
        }
    }

    // â”€â”€ Render song cards â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function renderSongs(songs) {
        const prefs_summary = [prefs.mood, prefs.energy, prefs.vocals, prefs.direction]
            .filter(Boolean).join(' Â· ');

        const cardsHtml = songs.slice(0, 6).map((s, i) => `
            <div class="song-card">
                <div class="song-num">Track ${String(i+1).padStart(2,'0')}</div>
                <div class="song-title">${esc(s.title)}</div>
                <div class="song-artist">${esc(s.artist)}</div>
                <div class="song-why">${esc(s.why)}</div>
                <div class="song-links">
                    <a class="link-btn link-yt"
                       href="${searchUrl('yt', s.artist, s.title)}"
                       target="_blank" rel="noopener">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        YouTube
                    </a>
                    <a class="link-btn link-sp"
                       href="${searchUrl('sp', s.artist, s.title)}"
                       target="_blank" rel="noopener">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.586 14.424a.622.622 0 0 1-.857.207c-2.348-1.435-5.304-1.76-8.785-.964a.622.622 0 1 1-.277-1.215c3.809-.87 7.076-.496 9.712 1.115a.622.622 0 0 1 .207.857zm1.223-2.722a.779.779 0 0 1-1.071.257c-2.687-1.652-6.785-2.131-9.965-1.166a.779.779 0 0 1-.435-1.493c3.632-1.057 8.147-.546 11.214 1.331a.779.779 0 0 1 .257 1.071zm.105-2.835C14.692 8.95 9.375 8.775 6.297 9.71a.935.935 0 1 1-.543-1.79c3.532-1.072 9.404-.865 13.115 1.337a.935.935 0 0 1-.955 1.61z"/></svg>
                        Spotify
                    </a>
                </div>
            </div>`).join('');

        document.getElementById('songsArea').innerHTML = `
            <div class="card fade-up">
                <div class="songs-header">
                    <div class="songs-title">Your Personalised Playlist</div>
                    <div class="songs-subtitle">6 tracks curated for &nbsp;<strong style="color:var(--purple-light)">${esc(prefs_summary)}</strong></div>
                </div>
                <div class="song-cards">${cardsHtml}</div>
            </div>`;

        document.getElementById('songsArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
</script>
