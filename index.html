<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Music Resonance Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:     #0A0A0F;
            --card:   #0F0F16;
            --border: rgba(201,168,76,0.15);
            --accent: #C9A84C;
            --text:   #FFFFFF;
            --muted:  rgba(255,255,255,0.45);
        }

        body {
            background: var(--bg); color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh; overflow-x: hidden; line-height: 1.6;
        }

        /* ── Site header ── */
        .site-header {
            position: sticky; top: 0; z-index: 100;
            background: var(--bg); border-bottom: 1px solid var(--accent);
            padding: 13px 32px; display: flex; align-items: center;
        }
        .site-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px; font-weight: 700;
            letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent);
        }

        /* ── Container ── */
        .container {
            max-width: 660px; margin: 0 auto;
            padding: 48px 24px 80px;
            display: flex; flex-direction: column; gap: 20px;
        }

        /* ── Page header ── */
        .page-header { text-align: center; margin-bottom: 24px; }
        .logo { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .logo-icon {
            width: 36px; height: 36px; border: 1px solid var(--accent);
            display: flex; align-items: center; justify-content: center; color: var(--accent);
        }
        .logo-wordmark {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px; font-weight: 700;
            letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent);
        }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(28px, 6vw, 44px); font-weight: 800;
            line-height: 1.1; letter-spacing: -1.5px; color: var(--text); margin-bottom: 14px;
        }
        .subtitle { color: var(--muted); font-size: 14px; letter-spacing: 0.3px; line-height: 1.7; }

        /* ── Shared card ── */
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 2px; padding: 36px; }

        /* ── Form fields ── */
        .field { margin-bottom: 22px; }
        label {
            display: flex; align-items: center; gap: 8px;
            font-size: 10px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.15em; color: var(--muted); margin-bottom: 10px;
        }
        .dot { width: 4px; height: 4px; background: var(--accent); flex-shrink: 0; }
        .save-badge {
            margin-left: auto; font-size: 10px; font-weight: 600;
            color: var(--accent); letter-spacing: 0.08em;
            opacity: 0; transition: opacity 0.3s; text-transform: none;
        }
        .save-badge.show { opacity: 1; }
        .badge-optional {
            margin-left: auto; font-size: 9px; font-weight: 600; padding: 2px 7px;
            border: 1px solid rgba(201,168,76,0.3); color: var(--accent);
            letter-spacing: 0.08em; text-transform: uppercase;
        }
        input[type="password"], textarea {
            width: 100%; background: transparent;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 2px;
            color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px;
            outline: none; transition: border-color 0.15s, background 0.15s;
        }
        input[type="password"] { padding: 14px 18px; letter-spacing: 4px; }
        textarea { padding: 18px 20px; resize: none; line-height: 1.85; height: 178px; }
        input[type="password"]:focus, textarea:focus {
            border-color: rgba(201,168,76,0.5); background: rgba(201,168,76,0.02);
        }
        ::placeholder { color: rgba(255,255,255,0.15); }
        .hint {
            display: flex; align-items: flex-start; gap: 6px;
            margin-top: 8px; font-size: 11px; color: var(--muted); line-height: 1.6;
        }
        .hint svg { flex-shrink: 0; margin-top: 2px; }
        .divider { height: 1px; background: rgba(201,168,76,0.12); margin: 28px 0; }

        /* ── Primary button ── */
        .btn-primary {
            width: 100%; padding: 16px; background: transparent;
            border: 1px solid var(--accent); border-radius: 2px; color: var(--accent);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;
            cursor: pointer; transition: background 0.15s;
        }
        .btn-primary:hover  { background: rgba(201,168,76,0.07); }
        .btn-primary:active { background: rgba(201,168,76,0.14); }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-inner { display: flex; align-items: center; justify-content: center; gap: 12px; }

        /* ── Waveform ── */
        .waveform { display: flex; align-items: center; gap: 3px; height: 16px; }
        .wb { width: 2px; background: var(--accent); border-radius: 1px; animation: wave 1.1s ease-in-out infinite; }
        .wb:nth-child(1) { height: 35%; animation-delay: 0.00s; }
        .wb:nth-child(2) { height: 65%; animation-delay: 0.10s; }
        .wb:nth-child(3) { height: 100%; animation-delay: 0.20s; }
        .wb:nth-child(4) { height: 55%; animation-delay: 0.30s; }
        .wb:nth-child(5) { height: 85%; animation-delay: 0.20s; }
        .wb:nth-child(6) { height: 45%; animation-delay: 0.10s; }
        .wb:nth-child(7) { height: 70%; animation-delay: 0.00s; }
        @keyframes wave {
            0%, 100% { transform: scaleY(0.35); opacity: 0.45; }
            50%       { transform: scaleY(1);    opacity: 1;    }
        }

        /* ── Spinner ── */
        .spinner {
            width: 15px; height: 15px;
            border: 1.5px solid rgba(201,168,76,0.3); border-top-color: var(--accent);
            border-radius: 50%; animation: spin 0.75s linear infinite; flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Error ── */
        .error {
            background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.2);
            border-radius: 2px; padding: 16px 18px; color: #FCA5A5;
            font-size: 13px; margin-top: 18px; line-height: 1.6;
        }

        /* ── Status / loading message ── */
        .status-msg {
            display: flex; align-items: center; justify-content: center; gap: 14px;
            padding: 32px 20px; color: var(--muted); font-size: 13px; letter-spacing: 0.04em;
        }

        /* ── Results ── */
        .vibe-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(22px, 5vw, 34px); font-weight: 800;
            letter-spacing: -1px; line-height: 1.15; color: var(--text); margin-bottom: 18px;
        }
        .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 24px; }
        .tag {
            padding: 4px 11px; font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
            border: 1px solid rgba(201,168,76,0.25); color: var(--accent); text-transform: uppercase;
        }
        .stats {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 1px; margin-bottom: 26px;
            background: rgba(201,168,76,0.1); border: 1px solid rgba(201,168,76,0.12);
        }
        .stat { background: var(--card); padding: 16px 14px; text-align: center; }
        .stat-lbl {
            font-size: 9px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.15em; color: var(--muted); margin-bottom: 8px;
        }
        .stat-val {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px; font-weight: 700; line-height: 1.25; font-variant-numeric: tabular-nums;
        }
        .section-lbl {
            font-size: 9px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.15em; color: var(--muted); margin-bottom: 12px;
        }
        .recs {
            display: flex; flex-direction: column;
            border: 1px solid rgba(201,168,76,0.12); margin-bottom: 26px;
        }
        .rec {
            display: flex; align-items: flex-start; gap: 16px; padding: 14px 16px;
            border-bottom: 1px solid rgba(201,168,76,0.08); transition: background 0.15s;
        }
        .rec:last-child { border-bottom: none; }
        .rec:hover { background: rgba(201,168,76,0.03); }
        .rec-num {
            font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 700;
            color: var(--accent); min-width: 20px; flex-shrink: 0; padding-top: 1px;
            font-variant-numeric: tabular-nums;
        }
        .rec-artist { font-size: 14px; font-weight: 600; }
        .rec-reason { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.55; }
        .scene-card {
            border: 1px solid rgba(201,168,76,0.15); border-left: 2px solid var(--accent);
            padding: 16px 18px; font-size: 14px; line-height: 1.75;
            color: rgba(255,255,255,0.65); font-style: italic;
        }

        /* ── DNA Summary ── */
        .dna-summary-card {
            border: 1px solid rgba(201,168,76,0.2); border-left: 2px solid var(--accent);
            padding: 20px 22px; margin-bottom: 28px;
        }
        .dna-summary-label {
            display: flex; align-items: center; gap: 8px;
            font-size: 9px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.15em; color: var(--accent); margin-bottom: 12px;
        }
        .dna-summary-text { font-size: 14px; line-height: 1.8; color: rgba(255,255,255,0.78); }

        /* ── 10-Dimension Scorecard ── */
        .dimensions-header {
            font-size: 9px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.15em; color: var(--muted);
            display: flex; align-items: center; gap: 8px;
            padding-bottom: 12px; border-bottom: 1px solid rgba(201,168,76,0.12);
        }
        .scorecard { display: flex; flex-direction: column; margin-bottom: 6px; }
        .scorecard-row {
            display: grid;
            grid-template-columns: 18px 130px 1fr;
            grid-template-areas: "icon label value" "icon . detail";
            column-gap: 14px; row-gap: 3px; padding: 13px 0;
            border-bottom: 1px solid rgba(201,168,76,0.07); align-items: center;
        }
        .scorecard-row:last-child { border-bottom: none; }
        .row-icon { grid-area: icon; color: var(--accent); display: flex; align-items: flex-start; justify-content: center; padding-top: 1px; }
        .row-label { grid-area: label; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.13em; color: var(--muted); line-height: 1.3; }
        .row-value { grid-area: value; font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1.3; }
        .row-detail { grid-area: detail; font-size: 11.5px; line-height: 1.6; color: var(--muted); }

        /* ── Instrument Profile Table ── */
        .instrument-section { margin-top: 24px; }
        .instrument-table { display: flex; flex-direction: column; }
        .instrument-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 0; border-bottom: 1px solid rgba(201,168,76,0.07);
        }
        .instrument-row:last-child { border-bottom: none; }
        .instrument-name { font-size: 12.5px; color: rgba(255,255,255,0.72); }
        .instrument-rating { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); min-width: 54px; text-align: right; }
        .instrument-rating.none { color: var(--muted); }
        .instrument-rating.low  { color: rgba(201,168,76,0.55); }

        /* ── Option Questions ── */
        .prefs-header { margin-bottom: 30px; }
        .prefs-title { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 6px; }
        .prefs-subtitle { font-size: 13px; color: var(--muted); line-height: 1.6; }
        .question-group { margin-bottom: 28px; padding-bottom: 28px; border-bottom: 1px solid rgba(201,168,76,0.08); }
        .question-group:last-of-type { border-bottom: none; margin-bottom: 24px; }
        .question-group-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; color: var(--accent); margin-bottom: 8px; }
        .question-desc { font-size: 12px; color: rgba(255,255,255,0.42); line-height: 1.5; margin-bottom: 10px; }
        .question-text { font-size: 13px; color: rgba(255,255,255,0.75); line-height: 1.55; margin-bottom: 14px; font-style: italic; }
        .options-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .option-card {
            flex: 1; min-width: 120px; padding: 10px 12px;
            border: 1px solid rgba(201,168,76,0.18); cursor: pointer;
            font-size: 12px; line-height: 1.45; color: rgba(255,255,255,0.7);
            transition: background 0.15s, border-color 0.15s; text-align: center;
            background: transparent; -webkit-user-select: none; user-select: none;
        }
        .option-card:hover { background: rgba(255,255,255,0.04); }
        .option-card.selected { border-color: var(--accent); background: rgba(201,168,76,0.08); color: #fff; }
        .progress-indicator { font-size: 11px; color: var(--muted); margin-bottom: 20px; letter-spacing: 0.05em; }
        .progress-indicator span { color: var(--accent); font-weight: 700; }

        /* ── Song cards ── */
        .songs-header { margin-bottom: 24px; }
        .songs-title { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.3px; color: var(--text); margin-bottom: 6px; }
        .songs-subtitle { font-size: 13px; color: var(--muted); line-height: 1.6; }
        .song-cards { display: flex; flex-direction: column; gap: 10px; }
        .song-card {
            border: 1px solid rgba(201,168,76,0.1); border-left: 2px solid var(--accent);
            padding: 18px 18px 14px 20px; transition: background 0.15s, border-color 0.15s;
        }
        .song-card:hover { background: rgba(201,168,76,0.02); border-color: rgba(201,168,76,0.22); }
        .song-num { font-size: 9px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
        .song-title { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.2; margin-bottom: 4px; color: var(--text); }
        .song-artist { font-size: 11px; color: var(--accent); font-weight: 600; margin-bottom: 10px; letter-spacing: 0.08em; text-transform: uppercase; }

        /* ── New song card metadata ── */
        .song-subgenre {
            display: inline-block; font-size: 9px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent);
            border: 1px solid rgba(201,168,76,0.3); padding: 2px 8px; margin-bottom: 9px;
        }
        .song-scene {
            font-size: 11.5px; color: var(--muted); margin-bottom: 10px;
            font-style: italic; line-height: 1.5;
        }
        .song-meta-row {
            display: flex; align-items: baseline; gap: 8px;
            font-size: 11.5px; color: rgba(255,255,255,0.6);
            line-height: 1.55; margin-bottom: 8px;
        }
        .song-meta-label {
            font-size: 8.5px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.12em; color: rgba(201,168,76,0.6);
            flex-shrink: 0; padding-top: 1px;
        }
        .pref-matches { display: flex; flex-wrap: wrap; margin-bottom: 10px; font-size: 10.5px; color: var(--muted); }
        .pref-match-tag + .pref-match-tag::before { content: ' · '; color: rgba(201,168,76,0.35); }

        .song-why { font-size: 13px; line-height: 1.75; color: rgba(255,255,255,0.58); margin-bottom: 12px; }
        .song-links { display: flex; gap: 8px; flex-wrap: wrap; }
        .link-btn {
            display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px;
            border-radius: 2px; font-size: 11px; font-weight: 600; text-decoration: none;
            letter-spacing: 0.05em; transition: background 0.15s;
        }
        .link-yt { background: transparent; border: 1px solid rgba(255,80,80,0.22); color: #FF8080; }
        .link-yt:hover { background: rgba(255,80,80,0.06); }
        .link-sp { background: transparent; border: 1px solid rgba(30,215,96,0.2); color: #1ED760; }
        .link-sp:hover { background: rgba(30,215,96,0.06); }
        .link-lfm { background: transparent; border: 1px solid rgba(188,51,51,0.25); color: #d4645b; }
        .link-lfm:hover { background: rgba(188,51,51,0.06); }
        .song-verify { font-size: 10px; color: rgba(255,255,255,0.25); margin-top: 8px; letter-spacing: 0.03em; }

        /* ── Last.fm note ── */
        .lfm-note { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; color: var(--muted); margin-top: 8px; }

        @media (max-width: 480px) {
            .scorecard-row { grid-template-columns: 18px 90px 1fr; }
            .site-header { padding: 12px 16px; }
            .card { padding: 24px 20px; }
            .options-row { flex-direction: column; }
            .option-card { min-width: unset; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <span class="site-title">House Music Resonance Engine</span>
</header>

<div class="container">

    <div class="page-header">
        <div class="logo">
            <div class="logo-icon">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <line x1="2" y1="13" x2="2" y2="7"/>
                    <line x1="5.5" y1="13" x2="5.5" y2="3"/>
                    <line x1="9" y1="13" x2="9" y2="8"/>
                    <line x1="12.5" y1="13" x2="12.5" y2="5"/>
                </svg>
            </div>
            <span class="logo-wordmark">Resonance Engine</span>
        </div>
        <h1>House Music<br>Resonance Engine</h1>
        <p class="subtitle">Drop 5 tracks &mdash; we'll decode your sonic identity across 10 dimensions.</p>
    </div>

    <div class="card">
        <div class="field">
            <label><span class="dot"></span>Your 5 House Tracks</label>
            <textarea id="songs" placeholder="Solomun - Welcome To The Wild&#10;Jamie Jones - My Paradise&#10;Fisher - Losing It&#10;Peggy Gou - It Makes You Forget (Itgehane)&#10;Chris Liebing - Stalker"></textarea>
            <div class="hint">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" opacity="0.45"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                One track per line &nbsp;·&nbsp; Format: <em>Artist&nbsp;-&nbsp;Song Title</em>
            </div>
        </div>

        <button class="btn-primary" id="analyseBtn" onclick="analyseVibe()">
            <div class="btn-inner" id="btnInner">
                <div class="waveform">
                    <div class="wb"></div><div class="wb"></div><div class="wb"></div>
                    <div class="wb"></div><div class="wb"></div><div class="wb"></div>
                    <div class="wb"></div>
                </div>
                Analyse My Vibe
            </div>
        </button>

        <div id="resultsArea"></div>
    </div>

    <div id="dnaArea"></div>
    <div id="prefsArea"></div>
    <div id="songsArea"></div>

</div>

<script>
    // ── State ──────────────────────────────────────────────────────
    let lastVibe = null;
    const questionAnswers = { beat_feel: null, sound_texture: null, emotion_hypnosis: null, track_journey: null, discovery_style: null };

    // ── SVG icons ──────────────────────────────────────────────────
    const DIM_ICONS = {
        tempo:      `<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><polyline points="8,5 8,8 10.5,8"/></svg>`,
        harmonic:   `<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 8C2.5 5 4.5 5 6 8S9.5 11 11 8 13.5 5 15 8"/></svg>`,
        texture:    `<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 5Q8 2 14 5"/><path d="M2 8Q8 5 14 8"/><path d="M2 11Q8 8 14 11"/></svg>`,
        emotional:  `<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><polygon points="8,2 14,8 8,14 2,8"/></svg>`,
        vocal:      `<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5.5" y="2" width="5" height="7" rx="2.5"/><path d="M3 9.5a5 5 0 0 0 10 0"/><line x1="8" y1="14.5" x2="8" y2="16"/><line x1="5" y1="16" x2="11" y2="16"/></svg>`,
        production: `<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="3" y1="14" x2="3" y2="6"/><line x1="8" y1="14" x2="8" y2="2"/><line x1="13" y1="14" x2="13" y2="8"/></svg>`,

    // ── Daily request limit ────────────────────────────────────────
    function todayStr() { return new Date().toISOString().slice(0, 10); }

    function checkDailyLimit() {
        const stored = JSON.parse(localStorage.getItem('daily_req') || '{}');
        return stored.date === todayStr() && stored.count >= 200;
    }

    function incrementDailyCount() {
        const today = todayStr();
        const stored = JSON.parse(localStorage.getItem('daily_req') || '{}');
        const count = stored.date === today ? stored.count + 1 : 1;
        localStorage.setItem('daily_req', JSON.stringify({ date: today, count }));
    }

    async function callAPI(systemPrompt, userPrompt, maxTokens = 1400, tools = null, timeoutMs = 60000) {
        if (checkDailyLimit()) throw new Error("We have hit today's limit. Check back tomorrow!");
        incrementDailyCount();

        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);

        const body = {
            model: 'claude-sonnet-4-6',
            max_tokens: maxTokens,
            system: systemPrompt,
            messages: [{ role: 'user', content: userPrompt }]
        };
        if (tools) body.tools = tools;

        try {
            const res = await fetch('/.netlify/functions/claude', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
                signal: controller.signal
            });

            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err?.error?.message || `API error ${res.status}`);
            }

            const data = await res.json();
            const textBlocks = (data?.content || []).filter(b => b.type === 'text').map(b => b.text);
            return textBlocks.length ? textBlocks.join('\n') : '';
        } catch (err) {
            if (err.name === 'AbortError') throw new Error('Taking longer than expected. Please try again.');
            throw err;
        } finally {
            clearTimeout(timer);
        }
    }

    function parseJSON(raw) {
        // Strip markdown code fences so ```json wrapping doesn't break parsing
        const stripped = raw.replace(/```(?:json)?\n?/g, '').replace(/```/g, '').trim();

        // Direct parse on stripped text
        try { return JSON.parse(stripped); } catch {}
        // Direct parse on original (in case stripping broke something)
        try { return JSON.parse(raw.trim()); } catch {}

        // Find the outermost JSON object { ... } — handles analysis responses
        const firstBrace = stripped.indexOf('{');
        if (firstBrace !== -1) {
            let depth = 0;
            for (let i = firstBrace; i < stripped.length; i++) {
                if (stripped[i] === '{' || stripped[i] === '[') depth++;
                else if (stripped[i] === '}' || stripped[i] === ']') {
                    if (--depth === 0) {
                        try { return JSON.parse(stripped.slice(firstBrace, i + 1)); } catch {}
                        break;
                    }
                }
            }
        }
        // Find the last JSON array — Claude may prefix with search reasoning
        const lastBracket = stripped.lastIndexOf('[');
        if (lastBracket !== -1) {
            let depth = 0;
            for (let i = lastBracket; i < stripped.length; i++) {
                if (stripped[i] === '[' || stripped[i] === '{') depth++;
                else if (stripped[i] === ']' || stripped[i] === '}') {
                    if (--depth === 0) {
                        try { return JSON.parse(stripped.slice(lastBracket, i + 1)); } catch {}
                        break;
                    }
                }
            }
        }
        // Last-resort regex
        const m = stripped.match(/[\[{][\s\S]*[\]}]/);
        if (m) { try { return JSON.parse(m[0]); } catch {} }
        throw new Error('Could not parse response. Please try again.');
    }

    // ── Last.fm ───────────────────────────────────────────────────
    async function fetchLastFmTrack(artist, title) {
        try {
            const url = `/.netlify/functions/lastfm?method=track.getInfo&artist=${encodeURIComponent(artist)}&track=${encodeURIComponent(title)}&autocorrect=1`;
            const res = await fetch(url);
            if (!res.ok) return null;
            const data = await res.json();
            if (data.error || !data.track) return null;
            const t = data.track;
            return {
                artist:    t.artist?.name ?? artist,
                title:     t.name ?? title,
                listeners: parseInt(t.listeners ?? '0', 10),
                playcount: parseInt(t.playcount ?? '0', 10),
                tags:      (t.toptags?.tag ?? []).slice(0, 5).map(x => x.name),
            };
        } catch { return null; }
    }

    async function fetchLastFmData(tracks) {
        return Promise.all(tracks.map(({ artist, title }) => fetchLastFmTrack(artist, title)));
    }

    async function fetchLastFmSimilar(tracks) {
        const results = await Promise.all(tracks.map(async ({ artist }) => {
            try {
                const url = `/.netlify/functions/lastfm?method=artist.getSimilar&artist=${encodeURIComponent(artist)}&limit=8&autocorrect=1`;
                const res = await fetch(url);
                if (!res.ok) return null;
                const data = await res.json();
                if (data.error || !data.similarartists) return null;
                const similar = (data.similarartists.artist || []).slice(0, 8).map(a => a.name);
                return similar.length ? { artist, similar } : null;
            } catch { return null; }
        }));
        return results.filter(Boolean);
    }

    // ── Parse tracks ──────────────────────────────────────────────
    function parseTracks(rawText) {
        return rawText.split('\n')
            .map(l => l.trim()).filter(Boolean)
            .map(l => {
                const idx = l.indexOf(' - ');
                if (idx === -1) return { artist: l, title: '' };
                return { artist: l.slice(0, idx).trim(), title: l.slice(idx + 3).trim() };
            });
    }

    // ── Find songs — single call, web search enabled ─────────────
    async function findSongs() {
        if (!lastVibe) return;

        const btn         = document.getElementById('findBtn');
        const inner       = document.getElementById('findBtnInner');
        const freeText    = (document.getElementById('freeText')?.value || '').trim();
        const hasFreeText = freeText.length > 0;
        const spinnerHtml = '<div class="spinner"></div>';

        btn.disabled = true;
        inner.innerHTML = `${spinnerHtml} Searching…`;

        // ── Cycling status messages ───────────────────────────────────
        const statusMsgs = [
            'Analysing your vibe DNA…',
            'Searching the music universe…',
            'Calibrating recommendations…',
            'Almost there…'
        ];
        let msgIdx = 0;
        const setStatus = msg =>
            document.getElementById('songsArea').innerHTML =
                `<div class="card"><div class="status-msg">${spinnerHtml} ${esc(msg)}</div></div>`;

        setStatus(statusMsgs[0]);
        const cycleTimer = setInterval(() => {
            msgIdx = (msgIdx + 1) % statusMsgs.length;
            setStatus(statusMsgs[msgIdx]);
        }, 8000);

        const norm = v => ((v - 3) / 2).toFixed(2);

        const dimSummary = (lastVibe.dimensions || []).map(d => {
            const meta = DIMENSION_META.find(m => m.id === d.id);
            return `${meta ? meta.label : d.id}: ${d.value}`;
        }).join('\n');

        const instrSummary = (lastVibe.instrumentProfile || [])
            .filter(i => i.prominence && i.prominence !== 'None')
            .map(i => `${i.name}: ${i.prominence}`)
            .join(', ');

        // ── Last.fm context ───────────────────────────────────────────
        const lfmRec = [];
        const _lfmData    = lastVibe._lfmData    || [];
        const _lfmSimilar = lastVibe._lfmSimilar || [];

        if (_lfmData.some(Boolean)) {
            lfmRec.push('LAST.FM TRACK DATA:');
            _lfmData.forEach((d, i) => {
                if (!d) return;
                lfmRec.push(`  Track ${i+1}: ${d.artist} — ${d.title}`);
                if (d.tags && d.tags.length) lfmRec.push(`    Tags: ${d.tags.join(', ')}`);
                if (d.listeners)             lfmRec.push(`    Listeners: ${d.listeners.toLocaleString()}`);
            });
        }
        if (_lfmSimilar.length) {
            lfmRec.push('\nLAST.FM SIMILAR ARTISTS:');
            _lfmSimilar.forEach(s => lfmRec.push(`  ${s.artist} → ${s.similar.join(', ')}`));
        }
        const lfmBlock = lfmRec.length ? lfmRec.join('\n') + '\n\n' : '';

        // ── Compact artist list ───────────────────────────────────────
        const compactArtists = ARTIST_UNIVERSE
            .split('\n')
            .filter(line => {
                const t = line.trim();
                if (!t) return false;
                if (t.startsWith('FULL ') || t.startsWith('---') || t.startsWith('Always ')) return false;
                if (/^[A-Z][A-Z\s\/&.\-]+:$/.test(t)) return false;
                return true;
            })
            .join('\n');

        // ── Scoring weights ───────────────────────────────────────────
        const weightsBlock = hasFreeText
            ? `SCORING WEIGHTS:\n- Weight A — 10-Dimension Analysis: 40%\n- Weight B — Question Calibration: 30%\n- Weight C — Free Text Description: 30%`
            : `SCORING WEIGHTS:\n- Weight A — 10-Dimension Analysis: 57%\n- Weight B — Question Calibration: 43%`;

        const freeTextBlock = hasFreeText
            ? `\nWEIGHT C — FREE TEXT (30%):\nParse for mood keywords, artist references, activity context, energy, scene:\n"${freeText}"\n`
            : '';

        const subgenres = `Chicago House, Deep House, Tech House, Afro House, Afro Tech, Melodic House, Progressive House, Organic House, Tribal House, Amapiano-adjacent, Soulful House, Vocal House, UK Garage, Bassline House, Acid House, Jackin House, Lo-Fi House, Minimal House, Nu-Disco House, French House, Balearic House, Disco House, Latin House, Brazilian House, Detroit House, NYC House, South African House, Gqom-adjacent, Rominimal, Deep Tech`;

        const system = `You are an expert house music curator. Use weighted scoring across all available sources — the curated artist universe, Last.fm signals, and live web search results — to surface the most sonically precise recommendations. Only recommend real, verifiable songs.`;

        const user = `Recommend 6–8 real house music tracks using weighted scoring across all sources.

${weightsBlock}

WEIGHT A — 10-DIMENSION ANALYSIS:
${dimSummary}
Instrumentation: ${instrSummary || 'not available'}

WEIGHT B — QUESTION CALIBRATION:
beat_feel ${norm(questionAnswers.beat_feel)} (driving→percussive) · sound_texture ${norm(questionAnswers.sound_texture)} (warm/analog→polished/digital) · emotion_hypnosis ${norm(questionAnswers.emotion_hypnosis)} (hypnotic→melodic) · track_journey ${norm(questionAnswers.track_journey)} (steady groove→build/drop arc) · discovery_style ${norm(questionAnswers.discovery_style)} (trusted artists→sound-led/unknown)
${freeTextBlock}
Context: ${lastVibe.vibeName} · Subgenres: ${(lastVibe.subgenres||[]).join(', ')}
Energy: ${lastVibe.energyLevel} · BPM: ${lastVibe.bpmRange} · Mood: ${(lastVibe.moodTags||[]).join(', ')}

${lfmBlock}ARTIST UNIVERSE (1,771 priority artists):
${compactArtists}

SOURCES: Draw holistically from all three — (1) the ARTIST_UNIVERSE above, (2) Last.fm similar artist signals, (3) live web search results. Pick the 6–8 best-scoring tracks regardless of source. Include mid-tier and underground artists — never default to only the top 40–50 most famous names.

CRITICAL — REAL TRACKS ONLY: Only recommend songs you are highly confident actually exist as released tracks. (1) Only recommend a song if it appears in your training data or web search results as a real released track. (2) Do not invent track names that sound plausible — only use real titles you are certain about. (3) If you are less than 90% confident a specific track exists, recommend a different confirmed track by the same artist instead. (4) For underground or emerging artists where you are unsure of specific track titles, use their most well-known confirmed track. (5) For web search results, only use track titles that appear in the actual search results.

SUBGENRES: ${subgenres}

Output ONLY a valid JSON array of 6–8 objects:
[
  {
    "title": "Exact Song Title",
    "artist": "Artist Name",
    "subgenre": "specific house subgenre",
    "sceneEra": "one-line scene/era context",
    "instrumentMatch": "comma-separated prominent instruments",
    "weightMatch": "e.g. Weight A: Geographic DNA + Weight B: Harmonic Depth + Weight C: 'late night' mood",
    "why": "Two sentences: first connects dominant dimension matches, second explains preference fit.",
    "dimensionMatches": ["one or two dimension labels"]
  }
]`;

        const WEB_SEARCH_TOOL = [{ type: 'web_search_20250305', name: 'web_search' }];

        try {
            const raw   = await callAPI(system, user, 3000, WEB_SEARCH_TOOL, 120000);
            const songs = parseJSON(raw);
            if (!Array.isArray(songs)) throw new Error('Unexpected response format — please try again.');
            renderSongs(songs, hasFreeText ? freeText : null);
        } catch (err) {
            const msg = err.message.includes('timed out')
                ? 'Taking longer than expected. Please try again.'
                : err.message;
            document.getElementById('songsArea').innerHTML =
                `<div class="card"><div class="error">${esc(msg)}</div></div>`;
        } finally {
            clearInterval(cycleTimer);
            btn.disabled = false;
            inner.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg> Find My Resonance`;
        }
    }

    // ── Render songs ──────────────────────────────────────────────
    function renderSongs(songs, freeText) {
        const sliderSummary = `Beat ${questionAnswers.beat_feel} · Texture ${questionAnswers.sound_texture} · Emotion ${questionAnswers.emotion_hypnosis} · Journey ${questionAnswers.track_journey} · Discovery ${questionAnswers.discovery_style}`;
        const subtitle = freeText
            ? `Weighted match — <strong style="color:var(--accent)">&ldquo;${esc(freeText.slice(0,60))}${freeText.length > 60 ? '…' : ''}&rdquo;</strong>`
            : `Matched to &nbsp;<strong style="color:var(--accent)">${esc(sliderSummary)}</strong>`;

        const cardsHtml = songs.slice(0, 8).map((s, i) => {
            const prefTagsHtml = (s.prefMatches || [])
                .map(p => `<span class="pref-match-tag">${esc(p)}</span>`).join('');

            return `
            <div class="song-card">
                <div class="song-num">Track ${String(i+1).padStart(2,'0')}</div>
                <div class="song-title">${esc(s.title)}</div>
                <div class="song-artist">${esc(s.artist)}</div>
                ${s.subgenre ? `<div class="song-subgenre">${esc(s.subgenre)}</div>` : ''}
                ${s.sceneEra ? `<div class="song-scene">${esc(s.sceneEra)}</div>` : ''}
                ${s.instrumentMatch ? `
                <div class="song-meta-row">
                    <span class="song-meta-label">Instruments</span>
                    <span>${esc(s.instrumentMatch)}</span>
                </div>` : ''}
                ${s.weightMatch ? `
                <div class="song-meta-row" style="margin-bottom:10px">
                    <span class="song-meta-label">Match</span>
                    <span style="font-size:11.5px;color:var(--muted);font-style:italic;line-height:1.55">${esc(s.weightMatch)}</span>
                </div>` : prefTagsHtml ? `
                <div class="song-meta-row" style="margin-bottom:12px">
                    <span class="song-meta-label">Pref Match</span>
                    <div class="pref-matches">${prefTagsHtml}</div>
                </div>` : ''}
                <div class="song-why">${esc(s.why)}</div>
                <div class="song-links">
                    <a class="link-btn link-yt" href="${searchUrl('yt', s.artist, s.title)}" target="_blank" rel="noopener">
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        YouTube
                    </a>
                    <a class="link-btn link-sp" href="${searchUrl('sp', s.artist, s.title)}" target="_blank" rel="noopener">
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.586 14.424a.622.622 0 0 1-.857.207c-2.348-1.435-5.304-1.76-8.785-.964a.622.622 0 1 1-.277-1.215c3.809-.87 7.076-.496 9.712 1.115a.622.622 0 0 1 .207.857zm1.223-2.722a.779.779 0 0 1-1.071.257c-2.687-1.652-6.785-2.131-9.965-1.166a.779.779 0 0 1-.435-1.493c3.632-1.057 8.147-.546 11.214 1.331a.779.779 0 0 1 .257 1.071zm.105-2.835C14.692 8.95 9.375 8.775 6.297 9.71a.935.935 0 1 1-.543-1.79c3.532-1.072 9.404-.865 13.115 1.337a.935.935 0 0 1-.955 1.61z"/></svg>
                        Spotify
                    </a>
                    <a class="link-btn link-lfm" href="${searchUrl('lfm', s.artist, s.title)}" target="_blank" rel="noopener">
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M10.96 2C5.991 2 2 5.99 2 10.96c0 4.97 3.99 8.96 8.96 8.96 4.97 0 8.96-3.99 8.96-8.96C19.92 5.99 15.93 2 10.96 2zm3.44 12.71l-1.15-2.77-1.85 2.1-2.01-4.21-.85 2.88H6.83l.98-3.34 1.14.44 1.29-4.36 1.94 4.05 1.86-2.1 1.65 3.97 1.14-1.81h1.34l-2.72 5.15z"/></svg>
                        Last.fm
                    </a>
                </div>
                <div class="song-verify">Verify on streaming platforms before listening.</div>
            </div>`;
        }).join('');

        document.getElementById('songsArea').innerHTML = `
            <div class="card">
                <div class="songs-header">
                    <div class="songs-title">Curated Playlist</div>
                    <div class="songs-subtitle">${subtitle}</div>
                </div>
                <div class="song-cards">${cardsHtml}</div>
            </div>`;

        document.getElementById('songsArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
</script>
